name: CI

on:
  push:
    branches: [main, developing]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  rust-core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libglib2.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  compression-service:
    name: Compression service (health)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compression-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `httpx` is what `fastapi.testclient.TestClient` imports; `httpx2` is
      # pinned in requirements.txt for the service's own client. Installing
      # only one of the two silently breaks the import below.
      - run: pip install fastapi uvicorn pydantic httpx httpx2
      - run: |
          python -c "
          from fastapi.testclient import TestClient
          from main import app
          c = TestClient(app)
          r = c.get('/health')
          assert r.status_code == 200, r.text
          print('health OK')
          "