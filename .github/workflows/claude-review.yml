# Claude PR Review — review every pull request with a third-party LLM routed
# through an Anthropic-compatible gateway (agentrouter.org).
#
# Uses the official anthropics/claude-code-action@v1, pointed at a custom
# ANTHROPIC_BASE_URL, with the model pinned to deepseek-v4-flash.
#
# Setup (one time, in the repo):
#   Settings → Secrets and variables → Actions → New repository secret
#   Name:  THIRD_PARTY_API_KEY
#   Value: a token valid for https://agentrouter.org
# Until that secret exists every run fails at the auth step.

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          # Auth token for the gateway, stored as a repo secret. The action
          # forwards this as the bearer token to ANTHROPIC_BASE_URL.
          anthropic_api_key: ${{ secrets.THIRD_PARTY_API_KEY }}

          # Route Anthropic API calls to the third-party gateway. CLAUDE_CODE_MODEL
          # mirrors the gateway's own env name; the real CLI override is --model
          # in claude_args below.
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://agentrouter.org",
                "CLAUDE_CODE_MODEL": "deepseek-v4-flash"
              }
            }

          # What the reviewer is told to do. The action checks out the PR head,
          # so the diff is present in the working directory.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.

            Focus on:
            - Correctness and bugs
            - Code quality and maintainability
            - Security implications
            - This repo's standing invariants: every tool is registered once in
              SPECS (src-tauri/src/bridge.rs) with a matching JSON Schema in
              tool_input_schema() and matching coercion in parse_tool_call();
              the bridge.rs/mcp.rs unit tests are the drift guard. Anything that
              writes, deletes, moves or runs a command must stay hidden from the
              connector's tools/list while the `mcp_allow_write` read-only gate
              is off. Tool output must never parse as a tool call.
            - Cross-language consistency (Rust core, frontend, compression-service).

            Post a top-level summary with `gh pr comment`. Use
            `mcp__github_inline_comment__create_inline_comment` (with
            confirmed: true) to flag specific lines. Only post review comments —
            do not submit text as a review body.

          claude_args: |
            --model deepseek-v4-flash
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
