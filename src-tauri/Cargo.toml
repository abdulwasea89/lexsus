[package]
name = "ai-continuity-bridge"
version = "0.1.0"
description = "Local-first AI continuity bridge: turn a web AI into a coding agent on your machine"
authors = ["AI Continuity Bridge"]
edition = "2021"

[lib]
name = "ai_continuity_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS / systems layer
# git2 uses vendored libgit2 + openssl so no system OpenSSL/GTK dev headers
# are required at build time beyond the Tauri GUI deps themselves.
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
portable-pty = "0.8"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled"] }

# Local WebSocket server for the browser extension (M2) — loopback only,
# plain ws:// on 127.0.0.1, no TLS needed.
tungstenite = "0.24"
# Pairing codes come from the OS CSPRNG (clock-derived codes were guessable).
getrandom = "0.2"
# Signal the process *group* when cancelling a running command (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
