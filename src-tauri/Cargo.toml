[package]
name = "ai-continuity-bridge"
version = "0.1.0"
description = "Local-first AI continuity bridge: turn a web AI into a coding agent on your machine"
authors = ["AI Continuity Bridge"]
edition = "2021"

[lib]
name = "ai_continuity_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS / systems layer
# git2 uses vendored libgit2 + openssl so no system OpenSSL/GTK dev headers
# are required at build time beyond the Tauri GUI deps themselves.
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
portable-pty = "0.8"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled"] }

# `walkdir` was added alongside an independent search implementation; the
# tool engine here uses `regex`/`glob` (declared below). Kept so the
# dependency set stays a superset of main's.
walkdir = "2.5"

# Token generation for the connector's auth layer (auth.rs). The OS CSPRNG
# rather than a seedable PRNG: a guessable bearer token is no token at all.
getrandom = "0.2"

# The connector's secure layer (auth.rs). `hmac`/`sha2` sign requests and
# responses, `subtle` makes the token comparison constant-time, and `zeroize`
# wipes secret material on drop. `keyring` keeps the token in the platform
# credential store (Secret Service / Keychain / Credential Manager) instead of
# a file in the app data dir.
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.9"
keyring = "3"

# The tool engine's single remote transport: rmcp serves a Streamable-HTTP MCP
# endpoint over loopback (axum drives its tower Service). Every call funnels
# through the same bridge policy engine — approvals, sensitive paths,
# source-scoped grants, kill switch, audit — as the desktop sandbox.
rmcp = { version = "3.2", features = ["transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tokio-util = "0.7"
regex = "1.13.1"
glob = "0.3.4"
# `web_fetch`. rustls rather than native-tls so the TLS stack is written in
# Rust and does not depend on the system OpenSSL's version agreeing with us;
# webpki-roots bundles the roots rather than reading a system store that may
# not exist on a minimal install. `charset` is deliberately *not* enabled:
# the body is decoded as UTF-8 and anything else says so rather than guessing.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
# Signal the process *group* when cancelling a running command (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `ServiceExt::oneshot` drives the real MCP router in-process, so the auth
# middleware is exercised through the same stack axum serves rather than
# through a hand-rolled imitation of it.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
